var jobs=["浜掕仈缃戠鎶€","鏁欒偛鍖荤枟","閲戣瀺绠＄悊","璁捐鑹烘湳","鑷敱鑱屼笟"];
var loveModes=["缁嗘按闀挎祦","涓€瑙佸€惧績","鍏卞悓鎴愰暱","娆㈠枩鍐ゅ","鍛借繍瀹夋帓"];
var fateEmojis={meet:["鉁?,"馃幃","馃寛","馃泦","馃摣"],job:["馃拠","馃彏","馃摮","馃幑","鉁堬笍"],age:["馃憱馃徎","馃憱馃従","馃","馃憱馃徏","馃憜馃徎"],mode:["馃尃","馃帄","馃尅","馃泤","馃泚"]};

var score={},currentIndex=0,quizTimer=null,resultData=null;

function showPage(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById('page-'+id).classList.add('active')}

function startQuiz(){score={W:0,L:0,Z:0,C:0,M:0};currentIndex=0;showPage('quiz');renderQuestion()}

function renderQuestion(){var q=questions[currentIndex];document.getElementById('quiz-current').textContent=currentIndex+1;document.getElementById('progress-fill').style.width=(currentIndex/questions.length*100)+'%';document.getElementById('question-num').textContent='绗?'+q.id+' 棰?;document.getElementById('question-title').textContent=q.title;document.getElementById('options-container').innerHTML=q.options.map(function(opt,idx){return '<div class="option" data-type="'+opt.type+'" data-idx="'+idx+'" onclick="selectOption(this)">'+opt.text+'</div>'}).join('')}

function selectOption(el){if(el.parentElement.querySelector('.selected'))return;score[el.dataset.type]+=1;var all=el.parentElement.querySelectorAll('.option');all.forEach(function(o){o.classList.add('faded')});el.classList.add('selected');clearTimeout(quizTimer);quizTimer=setTimeout(function(){currentIndex++;if(currentIndex<questions.length)renderQuestion();else showResult()},350)}

function showResult(){showPage('loading');if(token){localStorage.setItem('fp_used_'+token,'1');localStorage.removeItem('fp_sess_'+token)}setTimeout(function(){var sorted=Object.entries(score).sort(function(a,b){return b[1]-a[1]});var mainType=sorted[0][0],secondType=sorted[1][0];var pick=function(arr){return arr[Math.floor(Math.random()*arr.length)]};var mw=pick(meetWays),jb=pick(jobs),ag=pick(ageGaps),lm=pick(loveModes);resultData={typeName:TYPES[mainType],typeEmoji:TYPE_EMOJI[mainType],personalityText:personalityTemplates[mainType],partnerText:partnerTemplates[secondType],fateItems:[{emoji:fateEmojis.meet[meetWays.indexOf(mw)],label:'鐩搁亣鏂瑰紡',value:mw},{emoji:fateEmojis.job[jobs.indexOf(jb)],label:'鑱屼笟鏂瑰悜',value:jb},{emoji:fateEmojis.age[ageGaps.indexOf(ag)],label:'骞撮緞宸?,value:ag},{emoji:fateEmojis.mode[loveModes.indexOf(lm)],label:'鎭嬬埍妯″紡',value:lm}]};document.getElementById('result-badge').textContent=resultData.typeEmoji+' '+resultData.typeName;document.getElementById('result-type-name').textContent=resultData.typeName;document.getElementById('result-personality').textContent=resultData.personalityText;document.getElementById('result-partner').textContent=resultData.partnerText;document.getElementById('fate-grid').innerHTML=resultData.fateItems.map(function(i){return '<div class="fate-item"><div class="fate-emoji">'+i.emoji+'</div><div class="fate-label">'+i.label+'</div><div class="fate-value">'+i.value+'</div></div>'}).join('');showPage('result')},1800)}

function restart(){showPage('start')}
</script>
