<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token 管理 — 未来对象测试</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #fdf6f0; color: #5c3a3a; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .hint { font-size: 13px; color: #8c7a7a; margin-bottom: 20px; }
  .token-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0e0db; font-size: 14px; font-family: monospace; }
  .token-row .num { color: #c0afaf; min-width: 28px; }
  .token-row .code { flex:1; }
  .token-row button {
    padding: 4px 12px; border: 1px solid #e8786e; border-radius: 4px;
    background: #fff; color: #e8786e; cursor: pointer; font-size: 12px;
  }
  .token-row button:hover { background: #fef5f4; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #5c3a3a; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 14px; z-index: 99; display: none; }
</style>
</head>
<body>
<h1>🔭 未来对象测试 — Token 列表</h1>
<p class="hint">共 50 个 token。点击「复制链接」，发给付款用户即可。每个链接仅限一人使用。</p>
<div id="token-list"></div>
<div class="toast" id="toast">已复制！</div>

<script>
const TOKENS = [
  "yczjgnpt","un3utr4y","gr4y5pzr","apedzaxf","2m6kwmvu","ycn5j4hv","ftm3k3bk","mjj3gj4t",
  "zw3gvsb6","6h92a5ff","ft8fy669","jv8mc3mp","h5ewaaax","rq6b4kjs","ccwymw54","z479ty4c",
  "7useztfe","sjzh94f8","krj9fwbv","ak7gcbe3","v3dh3d2u","7rgc7v56","x9xbq47j","s6epw8br",
  "d7wfz7fg","zzcyq9yp","ratdndn3","65z68n78","p28a8xfz","3rmz2h5t","g27wq8ca","u5k5gjhn",
  "3ejyaxq4","44k73wbw","9gygqjtr","y8qcmktt","h87v8fsu","kc3wweh7","4x6ava7s","w49cgmrs",
  "j3y4zqy4","ye7ms75t","ytjyqt8g","bp8efpm8","wkm5rpgp","9bkqcuaz","8rnyc3c2","4r2krtwj",
  "49zfuabj","m5yngsdr"
];

const BASE = window.location.origin;

const list = document.getElementById('list');
TOKENS.forEach((t, i) => {
  const row = document.createElement('div');
  row.className = 'token-row';
  row.innerHTML = '<span class="num">' + (i+1) + '</span><span class="code">' + t + '</span><button onclick="copyLink(\'' + t + '\')">复制链接</button>';
  list.appendChild(row);
});

function copyLink(token) {
  const url = BASE + '/?token=' + token;
  navigator.clipboard.writeText(url).then(() => {
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 1500);
  });
}
</script>
</body>
</html>
